<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
<linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#d2a8ff"/></linearGradient>
<style>
.edge{stroke:#30363d;stroke-width:1.5;animation:glow 5.6s ease-in-out infinite}
.node{animation:pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes glow{0%,100%{stroke:#30363d}50%{stroke:#58a6ff}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.cursor{animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
</style>
</defs>
